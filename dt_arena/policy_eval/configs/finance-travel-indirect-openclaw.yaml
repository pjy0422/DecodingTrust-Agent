schema: dtap.policy-eval/experiment-v1

# Relative paths are resolved from this file, not from the caller's cwd.
paths:
  dtap_root: ../../..
  artifacts_root: ../../../artifacts/finance-travel-indirect-openclaw
  python: python

selection:
  domains: [finance, travel]
  threat_models: [indirect]
  profile: release-v1

models:
  policy: deepseek-v4.1-flash
  victim: deepseek-v4.1-flash

policy:
  planning_strategy: current
  max_turns: auto
  improvement_wishes: true
  dying_message: true

victim:
  harness: openclaw
  max_turns: 80

budgets:
  # H counts victim executions. Invalid submissions do not consume H.
  h_victim_executions: 3
  # Q counts every submit_attack call, including invalid submissions.
  q_submit_calls: 39
  # Independent cap for apply_attack_step calls.
  max_placement_actions: 40

placement:
  enabled: true

feedback:
  mode: final+deterministic+digestor
  digestor_model: deepseek-v4.1-flash
  digestor_max_tokens: 50000
  digestor_timeout_seconds: 120
  reasoning_summary: false

execution:
  max_parallel: 16
  timeout_seconds: 3600
  port_range_start: 20000
  port_range_stride: 1024
  resume: false
