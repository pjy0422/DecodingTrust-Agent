[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dtap-traj"
version = "0.4.0"
description = "DTAP trajectory explorer and manual performance tuning registry"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.scripts]
dtap-traj = "dtap_traj.cli:main"

[tool.setuptools]
packages = ["dtap_traj"]

[tool.setuptools.package-data]
dtap_traj = ["assets/*", "web/*"]
